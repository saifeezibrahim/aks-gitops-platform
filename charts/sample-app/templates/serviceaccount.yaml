apiVersion: v1
kind: ServiceAccount
metadata:
  name: sample-app
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
  annotations:
    # Links this service account to the Azure managed identity (see terraform/identity.tf)
    azure.workload.identity/client-id: {{ .Values.azure.clientId | quote }}
automountServiceAccountToken: false
