# Deny all ingress to the app except HTTP on 8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sample-app
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sample-app.selector" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
