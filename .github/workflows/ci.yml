name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md"]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/aks-gitops-sample-app

jobs:
  iac:
    name: Terraform, Helm and config scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive
      - name: terraform validate
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint charts/sample-app -f charts/sample-app/values-azure.yaml

      - name: Trivy misconfiguration scan (Terraform + Helm)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  sonar:
    name: SonarQube code analysis
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube scan
        # Skipped until a SONAR_TOKEN secret is added (SonarCloud is free for public repos).
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_HOST_URL: https://sonarcloud.io

  image:
    name: Build, scan and publish image
    needs: [iac]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the new image tag
      packages: write # to push to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t "$IMAGE:${{ steps.tag.outputs.tag }}" app

      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ steps.tag.outputs.tag }}"

      # GitOps: CI never touches the cluster. It records the new tag in Git and Argo CD deploys it.
      - name: Update image tag in Helm values
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sed -i "s|^  tag: .*|  tag: \"${{ steps.tag.outputs.tag }}\" # CI replaces this with the commit SHA|" charts/sample-app/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy sample-app ${{ steps.tag.outputs.tag }} [skip ci]"
          git push
